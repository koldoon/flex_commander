name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # нужно для создания релиза

jobs:
  release:
    # Обычный раннер GitHub. `macos-latest` — это arm64 (macOS 26), поэтому имя
    # артефакта ниже говорит правду про архитектуру.
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # SDK ставит action, а не образ: на macOS-раннерах Flutter не предустановлен.
      # Версия та же, что в CI, — выпуск должен собираться тем же, чем проверялся.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # Номер версии — из тега (v1.2.3 -> 1.2.3), номер сборки — счётчик прогонов.
      # pubspec.yaml при этом не трогаем.
      - name: Версия из тега
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Раннер и так одноразовый, но `flutter clean` оставлен намеренно: тот же
      # workflow запускают вручную (workflow_dispatch), и там чистота не дана.
      #
      # Подписи у раннера нет: проект собирается ad-hoc
      # (`CODE_SIGN_IDENTITY = "-"`). Значит, скачанное приложение нужно один раз
      # выпустить из карантина — `xattr -dr com.apple.quarantine`, — пока у
      # проекта нет сертификата разработчика и нотаризации.
      - name: Чистая сборка
        run: |
          flutter clean
          flutter pub get
          flutter build macos --release --no-tree-shake-icons \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ github.run_number }}"

      - name: Упаковка
        id: package
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/flex_commander.app"
          out="flex_commander-${{ steps.version.outputs.tag }}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$out"
          echo "path=${out}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.path }}
          generate_release_notes: true
