name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон: минуты macOS-раннера
# стоят вдесятеро против linux, и держать прогон ради устаревшего коммита незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Обычный раннер GitHub. `macos-latest` — это arm64 (macOS 26), то есть та же
    # архитектура, что и у машины разработки, и тот же артефакт на выходе.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # SDK ставит action, а не образ: на macOS-раннерах Flutter не предустановлен.
      # Версия прибита к той, на которой работают локально, — иначе CI начнёт падать
      # (или, хуже, переставать падать) от чужого обновления канала.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Версия окружения
        run: flutter --version

      - name: Зависимости воркспейса
        run: flutter pub get

      # Свою копию re_editor обходим: чужой код мы не переформатируем, иначе
      # отличия от апстрима перестанут быть теми двумя, что описаны в его README.
      - name: Форматирование
        run: |
          git ls-files -z '*.dart' | grep -zv '^dependency/re_editor/' \
            | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Статический анализ
        run: flutter analyze

      # Пакеты воркспейса перебираем каталогами: новый модуль в dependency/ подхватится сам,
      # а test_kit (без каталога test) пропустится.
      - name: Тесты
        run: |
          set -euo pipefail
          for pkg in . dependency/*/; do
            [ -d "${pkg}/test" ] || continue
            echo "::group::flutter test ${pkg}"
            (cd "$pkg" && flutter test)
            echo "::endgroup::"
          done

      # Вырезка глифов невозможна: DefaultIcons строит IconData не константой,
      # семейство шрифта приходит из темы во время работы.
      #
      # Подписи у раннера нет и не нужно: проект собирается ad-hoc
      # (`CODE_SIGN_IDENTITY = "-"`), сертификат для сборки не требуется.
      - name: Сборка macOS
        run: flutter build macos --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v7
        with:
          name: flex_commander-macos-${{ github.sha }}
          path: build/macos/Build/Products/Release/flex_commander.app
          retention-days: 7
