name: flex_commander
description: "Flex File Commander"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.7.0

# Приложение — корень воркспейса: пакеты рядом собираются вместе с ним, одной
# разрешённой версией зависимостей на всех. Сюда добавляются api и модули.
workspace:
  - dependency/7z
  - dependency/api
  - dependency/default_theme
  - dependency/editor
  - dependency/file_info
  - dependency/file_ops
  - dependency/image_viewer
  - dependency/local_fs
  - dependency/navigation
  - dependency/panels
  - dependency/platform
  # Своя копия re_editor: в ней две правки, без которых выделение в редакторе и
  # просмотрщике разрывается между строками. Членство в воркспейсе и есть
  # подмена — все, кто просит re_editor, получают её.
  - dependency/re_editor
  - dependency/ssh
  - dependency/tar
  - dependency/terminal
  - dependency/test_kit
  - dependency/text_kit
  - dependency/text_viewer
  - dependency/ui_kit
  - dependency/viewer
  - dependency/zip

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # API приложения: модели, интерфейсы, командный фреймворк. Модули зависят
  # только от него, ядро — от него же плюс своя реализация.
  fc_api:
    path: dependency/api

  # Модули приложения: ядро знает их только по этому списку.
  fc_7z:
    path: dependency/7z

  fc_default_theme:
    path: dependency/default_theme

  fc_editor:
    path: dependency/editor

  fc_file_ops:
    path: dependency/file_ops

  fc_local_fs:
    path: dependency/local_fs

  fc_navigation:
    path: dependency/navigation

  fc_platform:
    path: dependency/platform

  fc_panels:
    path: dependency/panels

  fc_ssh:
    path: dependency/ssh

  fc_tar:
    path: dependency/tar

  fc_terminal:
    path: dependency/terminal

  fc_ui_kit:
    path: dependency/ui_kit

  fc_viewer:
    path: dependency/viewer

  fc_text_viewer:
    path: dependency/text_viewer

  fc_image_viewer:
    path: dependency/image_viewer

  fc_file_info:
    path: dependency/file_info

  fc_zip:
    path: dependency/zip

  path: ^1.9.1            # basename/extension/join/normalize
  ffi: ^2.1.4             # calloc и строки для copyfile(3)
  window_manager: ^0.5.2  # положение и размер окна между запусками
  dicom: ^0.0.4           # контейнер зависимостей
  logecom: ^0.0.11        # логирование операций и ошибок ФС

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Подставные провайдер дерева и служба окна. Отдельным пакетом, а не в
  # `test/`: каталог тестов нельзя импортировать из другого пакета, а тесты
  # модулей должны собирать приложение из тех же подставок.
  fc_test_kit:
    path: dependency/test_kit

  # Показ текста — ради замера сетки строк в test/rendering.
  fc_text_kit:
    path: dependency/text_kit

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Шрифты приложения: интерфейс — Ubuntu, иконки — FontAwesome. Оба свободные
  # (Ubuntu Font Licence 1.0 и SIL OFL 1.1), поэтому лежат здесь и приложение
  # выглядит одинаково на любой системе.
  #
  # Моноширинного шрифта здесь нет намеренно: список файлов набирается тем, что
  # стоит у пользователя. Имя осталось прежним — Consolas, — но берётся он из
  # системы: это проприетарный шрифт Microsoft, лицензированный только вместе с
  # тем продуктом, в котором поставлен, и класть его в чужой дистрибутив нельзя.
  # Где его нет, подставляется системный моноширинный — см. `DefaultFonts`.
  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu-R.ttf
        - asset: assets/fonts/Ubuntu-B.ttf
          weight: 700
    - family: FontAwesome
      fonts:
        - asset: assets/fonts/fontawesome-webfont.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
