name: fc_viewer
description: "Оболочка просмотра: выбирает подходящий просмотрщик и ставит его в область."
publish_to: 'none'
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  fc_api:
    path: ../api

  fc_ui_kit:
    path: ../ui_kit

dev_dependencies:
  flutter_test:
    sdk: flutter

  fc_test_kit:
    path: ../test_kit

  fc_default_theme:
    path: ../default_theme

  # Тестам оболочки нужен хоть один настоящий просмотрщик: она сама не
  # показывает ничего.
  fc_text_viewer:
    path: ../text_viewer

  flex_commander:
    path: ../..

  # Быстрый просмотр встаёт рядом со списком файлов, и виджет-тест смотрит на
  # оба сразу: показ — наш, таблица — оттуда.
  fc_panels:
    path: ../panels

  # Виджет-тест смотрит на показанный текст: это `FcTextView` из общего показа.
  fc_text_kit:
    path: ../text_kit

  re_editor: ^0.10.0
