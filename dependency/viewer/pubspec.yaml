name: fc_viewer
description: "Просмотрщик текста: файл во весь экран, с подсветкой и переносом строк."
publish_to: 'none'
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  fc_api:
    path: ../api

  fc_ui_kit:
    path: ../ui_kit

  # Ради `CodeLineEditingController`: содержимое, курсор и выделение держит
  # экран, а не виджет. Сам показ собран в `fc_ui_kit` — там же и подсветка.
  re_editor: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  fc_test_kit:
    path: ../test_kit

  fc_default_theme:
    path: ../default_theme

  flex_commander:
    path: ../..
