name: fc_ui_kit
description: "Общие элементы интерфейса: рамки, окна команд, кнопки, поля ввода."
publish_to: 'none'
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  fc_api:
    path: ../api

  # Показ текста: просмотрщик и редактор собраны на нём. В проекте лежит своя
  # копия — dependency/re_editor, см. её README.
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  fc_default_theme:
    path: ../default_theme
