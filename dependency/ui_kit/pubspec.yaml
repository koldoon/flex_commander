name: fc_ui_kit
description: "Общие элементы интерфейса: рамки, окна команд, кнопки, поля ввода."
publish_to: 'none'
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  fc_api:
    path: ../api


  fc_ui_api:
    path: ../ui_api

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Подставки и подъём виджета в дереве: `pumpScreen` собирает тему и область
  # приложения, а без них ни одну форму не проверить.
  fc_test_kit:
    path: ../test_kit

  fc_default_theme:
    path: ../default_theme
