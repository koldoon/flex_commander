name: fc_updater
description: "Приложение обновляет себя само: выпуск с GitHub, проверка суммы, подмена .app."
publish_to: 'none'
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  fc_api:
    path: ../api

  fc_core_api:
    path: ../core_api

  fc_ui_api:
    path: ../ui_api

  fc_ui_kit:
    path: ../ui_kit

  # Сумма скачанного сверяется с той, что назвал GitHub. Пакет команды Dart,
  # без зависимостей: считать sha256 вызовом `shasum` значило бы доверять
  # ещё и оболочке.
  crypto: ^3.0.3

  path: ^1.9.1

  # Журнал: канал раннера может не отозваться, и об этом стоит сказать в лог,
  # а не человеку — обновление от этого просто не предложится.
  logecom: ^0.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  fc_test_kit:
    path: ../test_kit

  # Помощника проверяем настоящей оболочкой: подставкой его не проверить.
  fc_platform:
    path: ../platform
