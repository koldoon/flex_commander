name: fc_test_kit
description: "Подставные зависимости для тестов Flex Commander: дерево в памяти и окно без системы."
publish_to: 'none'
version: 1.0.0

# Пакет собирается вместе с приложением: одна разрешённая версия зависимостей
# на весь воркспейс.
resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Подставной провайдер написан против API — как и любой настоящий.
  fc_api:
    path: ../api

  # Панель для тестов собирается из контроллеров ядра. Обратная зависимость —
  # только dev: приложению фейки нужны в тестах и никогда в сборке.
  flex_commander:
    path: ../..

  # Подставки живут в тестах и пользуются их же средствами: `testApp`
  # сам закрывает за собой приложение и временный каталог.
  flutter_test:
    sdk: flutter

  path: ^1.9.1
