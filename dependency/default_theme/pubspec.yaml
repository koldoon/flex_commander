name: fc_default_theme
description: "Оформление по умолчанию и команды выбора темы."
publish_to: 'none'
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  fc_api:
    path: ../api

  fc_ui_api:
    path: ../ui_api

  fc_ui_kit:
    path: ../ui_kit

dev_dependencies:
  flutter_test:
    sdk: flutter

  fc_test_kit:
    path: ../test_kit

flutter:
  # Знаки полосы заголовка окна — крестик и «?» — из Phosphor Light (MIT,
  # `assets/fonts/Phosphor-LICENSE`). Только шрифт: Dart-код пакета
  # `phosphor_flutter` 2.1.0 наследует `IconData`, который стал `final`, и не
  # собирается. Номера знаков — в `DefaultIcons`.
  fonts:
    - family: PhosphorLight
      fonts:
        - asset: assets/fonts/Phosphor-Light.ttf
