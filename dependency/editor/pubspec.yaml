name: fc_editor
description: "Редактор текста: правка файла во весь экран."
publish_to: 'none'
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  fc_api:
    path: ../api

  fc_core_api:
    path: ../core_api

  fc_ui_api:
    path: ../ui_api

  fc_ui_kit:
    path: ../ui_kit

  # Показ текста: поле, оформление, подсветка, поиск — общее с просмотрщиком.
  fc_text_kit:
    path: ../text_kit

  # Ради `CodeLineEditingController`: содержимое и курсор держит экран, а не
  # виджет. Сам показ собран в `fc_ui_kit` — там же и подсветка, и язык, и
  # оформление.
  re_editor: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  fc_test_kit:
    path: ../test_kit

  fc_default_theme:
    path: ../default_theme

  flex_commander:
    path: ../..

  # Тестам нужны настоящие пути на диске: сохранение проверяется на нём.
  path: ^1.9.1

  # Тесты собирают настоящее приложение, а корневой источник в нём —
  # локальная файловая система.
  fc_local_fs:
    path: ../local_fs
