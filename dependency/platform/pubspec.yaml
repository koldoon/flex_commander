name: fc_platform
description: "То, что умеет только настоящая машина: окно, буфер обмена, запуск программ, псевдотерминал, примитивы файловой системы."
publish_to: 'none'
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Реализуются здесь контракты, объявленные в API, — и больше ничего отсюда
  # не нужно.
  fc_api:
    path: ../api

  fc_core_api:
    path: ../core_api

  fc_ui_api:
    path: ../ui_api

  path: ^1.9.1            # basename/extension/join/normalize
  ffi: ^2.1.4             # calloc и строки для copyfile(3) и chmod(2)
  window_manager: ^0.5.2  # положение и размер окна между запусками

dev_dependencies:
  flutter_test:
    sdk: flutter
