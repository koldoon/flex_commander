name: fc_pdf_viewer
description: "Просмотрщик PDF: страницы рисует система, показ и поиск — свои."
publish_to: 'none'
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  fc_api:
    path: ../api

  fc_ui_api:
    path: ../ui_api

  fc_ui_kit:
    path: ../ui_kit

  # Текст документа по `F5` и окно поиска — те же, что у всего показа текста.
  fc_text_kit:
    path: ../text_kit

  # Буфер текста документа — им же владеет показ текста.
  re_editor: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  fc_test_kit:
    path: ../test_kit

  # Узлы подставного диска: тесты читают файл так же, как просмотрщик.
  fc_core_api:
    path: ../core_api

  fc_default_theme:
    path: ../default_theme

  flex_commander:
    path: ../..

  # Оболочка просмотра: без неё F3 некому обслужить, а тесты открывают файл
  # так же, как это делает человек.
  fc_viewer:
    path: ../viewer

  # Проверяем и то, что реестр не перепутал: текст остался за текстовым.
  fc_text_viewer:
    path: ../text_viewer
