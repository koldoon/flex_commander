name: fc_zip
description: "Zip-архив как дерево: панель входит в него, как в каталог."
publish_to: 'none'
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  fc_api:
    path: ../api

  fc_ui_kit:
    path: ../ui_kit

  archive: ^4.0.9
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  fc_test_kit:
    path: ../test_kit

  # Архив требует произвольного доступа к файлу, поэтому тесты работают с
  # настоящим диском: локальный провайдер и место под временные файлы — оттуда.
  flex_commander:
    path: ../..

  # Окно команды рисуется настоящим оформлением: своих значений у API нет.
  fc_default_theme:
    path: ../default_theme

  # Тесты собирают настоящее приложение, а корневой источник в нём —
  # локальная файловая система.
  fc_local_fs:
    path: ../local_fs

  # Платформенное: временные каталоги и запуск программ.
  fc_platform:
    path: ../platform
