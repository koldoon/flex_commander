name: fc_navigation
description: "Перемещение по дереву и пометка объектов: команды и клавиши за ними."
publish_to: 'none'
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Модуль знает только API — ни о ядре, ни о других модулях он не подозревает.
  fc_api:
    path: ../api

  fc_ui_kit:
    path: ../ui_kit

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Тесты собирают настоящее приложение с этим модулем — окно маски
  # проверяется целиком, от клавиши до пометки в панели.
  fc_test_kit:
    path: ../test_kit

  flex_commander:
    path: ../..
