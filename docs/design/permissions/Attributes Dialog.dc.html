<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url("https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap");
body { margin:0; background:#071626; font-family:Ubuntu,"Segoe UI",Helvetica,Arial,sans-serif; }
input, button, textarea, select { font-family:Ubuntu,"Segoe UI",Helvetica,Arial,sans-serif; }
a { color:#7aa7d8; } a:hover { color:#a8c6e8; }
input::placeholder { color:#6f8aa4; }
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;box-sizing:border-box;background:#071626">
  <div style="width:100%;max-width:620px;background:#0b2138;border:1px solid #24486b;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.55);overflow:hidden;color:#e8f0f8">

    <div style="background:#1b4a7c;padding:8px 13px;display:flex;align-items:center;gap:10px;min-width:0">
      <div title="{{ fileName }}" style="font-size:15px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;direction:ltr">{{ fileName }}</div>
    </div>

    <div style="padding:12px 14px 12px">

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap">
        <div style="font-size:13px;font-weight:700;color:#e8f0f8">Octal</div>
        <input value="0644" style="width:78px;box-sizing:border-box;background:#12293e;border:1px solid #2a4a68;border-radius:4px;color:#e8f0f8;font-size:13px;font-weight:700;padding:5px 8px" />
        <div style="font-size:13px;color:#dce8f4;letter-spacing:1.5px">-rw-r--r--</div>
        <div style="font-size:12.5px;color:#8fa8c0">User rw · Group r · Others r</div>
      </div>

      <div style="display:flex;gap:8px">
        <div style="flex:1 1 0;min-width:0;background:#0e263c;border:1px solid #23445f;border-radius:5px;padding:8px">
          <div style="font-size:11.5px;color:#8fa8c0;margin-bottom:6px">User</div>
          <div style="display:flex;flex-direction:column;gap:5px">
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dce8f4;cursor:pointer"><input type="checkbox" checked="{{ true }}" style="width:14px;height:14px;accent-color:#4c63c9;margin:0" />read</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dce8f4;cursor:pointer"><input type="checkbox" checked="{{ true }}" style="width:14px;height:14px;accent-color:#4c63c9;margin:0" />write</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dce8f4;cursor:pointer"><input type="checkbox" style="width:14px;height:14px;accent-color:#4c63c9;margin:0" />exec</label>
          </div>
        </div>
        <div style="flex:1 1 0;min-width:0;background:#0e263c;border:1px solid #23445f;border-radius:5px;padding:8px">
          <div style="font-size:11.5px;color:#8fa8c0;margin-bottom:6px">Group</div>
          <div style="display:flex;flex-direction:column;gap:5px">
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dce8f4;cursor:pointer"><input type="checkbox" checked="{{ true }}" style="width:14px;height:14px;accent-color:#4c63c9;margin:0" />read</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dce8f4;cursor:pointer"><input type="checkbox" style="width:14px;height:14px;accent-color:#4c63c9;margin:0" />write</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dce8f4;cursor:pointer"><input type="checkbox" style="width:14px;height:14px;accent-color:#4c63c9;margin:0" />exec</label>
          </div>
        </div>
        <div style="flex:1 1 0;min-width:0;background:#0e263c;border:1px solid #23445f;border-radius:5px;padding:8px">
          <div style="font-size:11.5px;color:#8fa8c0;margin-bottom:6px">Others</div>
          <div style="display:flex;flex-direction:column;gap:5px">
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dce8f4;cursor:pointer"><input type="checkbox" checked="{{ true }}" style="width:14px;height:14px;accent-color:#4c63c9;margin:0" />read</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dce8f4;cursor:pointer"><input type="checkbox" style="width:14px;height:14px;accent-color:#4c63c9;margin:0" />write</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dce8f4;cursor:pointer"><input type="checkbox" style="width:14px;height:14px;accent-color:#4c63c9;margin:0" />exec</label>
          </div>
        </div>
        <div style="flex:1 1 0;min-width:0;background:#0e263c;border:1px solid #23445f;border-radius:5px;padding:8px">
          <div style="font-size:11.5px;color:#8fa8c0;margin-bottom:6px">Special</div>
          <div style="display:flex;flex-direction:column;gap:5px">
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dce8f4;cursor:pointer"><input type="checkbox" style="width:14px;height:14px;accent-color:#4c63c9;margin:0" />setuid</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dce8f4;cursor:pointer"><input type="checkbox" style="width:14px;height:14px;accent-color:#4c63c9;margin:0" />setgid</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dce8f4;cursor:pointer"><input type="checkbox" style="width:14px;height:14px;accent-color:#4c63c9;margin:0" />sticky</label>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;align-items:center;margin-top:18px">
        <div style="font-size:13px;font-weight:700;text-align:right;color:#e8f0f8">Owner</div>
        <div style="display:flex;gap:10px;min-width:0">
          <input value="koldoon" style="width:170px;box-sizing:border-box;background:#12293e;border:1px solid #2a4a68;border-radius:4px;color:#e8f0f8;font-size:13px;padding:5px 8px" />
          <input value="staff" style="width:170px;box-sizing:border-box;background:#12293e;border:1px solid #2a4a68;border-radius:4px;color:#e8f0f8;font-size:13px;padding:5px 8px" />
        </div>

        <div style="font-size:13px;font-weight:700;text-align:right;color:#e8f0f8">Modified</div>
        <input value="2026-09-09 02:06:59" style="width:168px;box-sizing:border-box;background:#12293e;border:1px solid #2a4a68;border-radius:4px;color:#e8f0f8;font-size:13px;padding:5px 8px" />

        <div style="font-size:13px;font-weight:700;text-align:right;color:#e8f0f8">Accessed</div>
        <input value="2026-09-10 18:19:26" style="width:168px;box-sizing:border-box;background:#12293e;border:1px solid #2a4a68;border-radius:4px;color:#e8f0f8;font-size:13px;padding:5px 8px" />
      </div>

      <div style="display:flex;align-items:baseline;gap:10px;margin:20px 0 7px">
        <div style="font-size:13px;font-weight:700;color:#e8f0f8">Extended attributes</div>
        <div style="font-size:12px;color:#7f9bb5">{{ countLabel }}</div>
      </div>

      <div style="display:flex;flex-direction:column;max-height:200px;overflow-y:auto">
        <sc-for list="{{ attrs }}" as="attr" hint-placeholder-count="4">
          <div style="display:grid;grid-template-columns:minmax(90px,1fr) auto minmax(120px,1.3fr) auto;gap:8px;align-items:center;padding:4px 0;min-width:0">
            <div title="{{ attr.name }}" style="min-width:0;font-size:12px;color:#b9cfe3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ attr.name }}</div>
            <div style="font-size:11px;color:#7f9bb5;white-space:nowrap">{{ attr.size }}</div>
            <input value="{{ attr.value }}" title="{{ attr.value }}" placeholder="binary" style="min-width:0;width:100%;box-sizing:border-box;background:#12293e;border:1px solid #2a4a68;border-radius:3px;color:#dfeaf4;font-size:12px;padding:4px 7px" />
            <button style="background:#1b4b80;border:1px solid #2c5f9c;border-radius:3px;color:#eaf2fa;font-size:11.5px;padding:4px 9px;cursor:pointer;white-space:nowrap" style-hover="background:#235b96">Remove</button>
          </div>
        </sc-for>
      </div>

      <div style="display:grid;grid-template-columns:minmax(90px,1fr) minmax(120px,1.3fr) auto;gap:8px;align-items:center;margin-top:7px;min-width:0">
        <input placeholder="name" style="flex:1 1 0;min-width:0;box-sizing:border-box;background:#12293e;border:1px solid #2a4a68;border-radius:4px;color:#e8f0f8;font-size:13px;padding:5px 8px" />
        <input placeholder="value" style="flex:1.6 1 0;min-width:0;box-sizing:border-box;background:#12293e;border:1px solid #2a4a68;border-radius:4px;color:#e8f0f8;font-size:13px;padding:5px 8px" />
        <button style="flex:0 0 auto;background:#1b4b80;border:1px solid #2c5f9c;border-radius:4px;color:#eaf2fa;font-size:12px;padding:5px 13px;cursor:pointer" style-hover="background:#235b96">Add</button>
      </div>

      <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:20px">
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="font-size:13px;font-weight:700;color:#e8f0f8">Apply to</div>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <div style="position:relative;display:flex;align-items:center;background:#12293e;border:1px solid #2a4a68;border-radius:4px;padding:5px 26px 5px 9px;font-size:13px;color:#8fa8c0">files and directories<span style="position:absolute;right:10px;font-size:9px">▼</span></div>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#7f9bb5;cursor:pointer"><input type="checkbox" style="width:14px;height:14px;accent-color:#4c63c9;margin:0" />Recursive</label>
          </div>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px">
        <button style="background:#1b4b80;border:1px solid #2c5f9c;border-radius:4px;color:#eaf2fa;font-size:13px;padding:6px 18px;cursor:pointer" style-hover="background:#235b96">Cancel</button>
        <button style="background:#4c63c9;border:1px solid #6478d6;border-radius:4px;color:#fff;font-size:13px;padding:6px 22px;cursor:pointer;font-weight:600" style-hover="background:#5a71d6">Apply</button>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:900},&quot;fileName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Миниатюрная прядильница Natasha White супер возбуждена поэтому она шпилит свою лучшую подругу и глотает всё до последней капли.mp4&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showLongAttrs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const longName = "Миниатюрная прядильница Natasha White супер возбуждена поэтому она шпилит свою лучшую подругу и глотает всё до последней капли.mp4";
    const attrs = [
      { name: "com.apple.macl", size: "72 bytes", value: "" },
      { name: "com.apple.metadata:kMDItemWhereFroms", size: "66 bytes", value: "https://example.com/downloads/very/long/path/to/file.mp4" },
      { name: "com.apple.provenance", size: "11 bytes", value: "" },
      { name: "com.apple.quarantine", size: "57 bytes", value: "0281;6aa09513;Chrome;C6460336-67E0-469D-8927-5C67831C9827" }
    ];
    const list = this.props.showLongAttrs === false ? attrs.slice(0, 2) : attrs;
    return {
      fileName: this.props.fileName ?? longName,
      attrs: list,
      countLabel: list.length + (list.length === 1 ? " attribute" : " attributes")
    };
  }
}
</script>
</body>
</html>
