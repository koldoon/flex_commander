# Предел на тест — минута, а не десять минут по умолчанию.
#
# Повисший тест не должен съедать прогон: если минуты не хватило, дело не в
# медленной машине, а в том, что тест кого-то ждёт и не дождётся. Тем, кому
# минуты мало по существу (живой сервер, внешняя программа), предел ставят
# у себя — `@Timeout(...)` в самом файле.
timeout: 60s
